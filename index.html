  const x = c.getContext('2d'); x.drawImage(im, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);

function drawAnim(type, anim, p, x, foot, h, flip = false, alpha = 1, sc = 1, white = 0, sx2 = 1, sy2 = 1) {
  const A = ANIM[type]; if (!A) return false;
  const list = A.anims[anim]; const fi = list[Math.max(0, Math.min(list.length - 1, Math.floor(p)))];
  const k = h / (A.charH * A.unit) * sc, sx = (fi % A.cols) * A.cw, sy = Math.floor(fi / A.cols) * A.ch;

  ctx.drawImage(A.im, sx, sy, A.cw, A.ch, -A.foot[0] * k, -A.foot[1] * k, A.cw * k, A.ch * k);
  if (white > 0) { ctx.globalAlpha *= Math.min(1, white); ctx.drawImage(animWhite(type), sx, sy, A.cw, A.ch, -A.foot[0] * k, -A.foot[1] * k, A.cw * k, A.ch * k); }

}

function activate(key) {

cv.addEventListener('pointercancel', () => { drag = null; press = null; });
