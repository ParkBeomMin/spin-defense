<script>
// ===== 언어 (브라우저가 한국어면 한국어, 일본어면 일본어, 그 밖은 영어. ?lang=ko|ja|en 으로 고정) =====
const LANG = (() => { const q = new URLSearchParams(location.search).get('lang'); if (q === 'ja' || q === 'ko' || q === 'en') return q; const ls = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']; for (const l of ls) { if (/^ja/i.test(l)) return 'ja'; if (/^ko/i.test(l)) return 'ko'; } return ls.length && ls[0] ? 'en' : 'ko'; })();
const L = (ko, ja, en) => LANG === 'ja' ? ja : LANG === 'en' ? (en !== undefined ? en : ja) : ko;
document.documentElement.lang = LANG;
if (LANG !== 'ko') document.title = L('스핀 디펜스', 'スピンディフェンス', 'Spin Defense');
document.addEventListener('DOMContentLoaded', () => { const lb = document.querySelector('#adbar .lbl'); if (lb) lb.textContent = L('광고', '広告', 'Ad'); });

'use strict';
// =====================================================================
// 스핀 디펜스 : 영웅 소환 + 랜덤 디펜스
// =====================================================================
const W = 360, H = 640;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1;
// ===== 광고 설정 (AdSense H5 Games Ads + 하단 배너) =====
const ADS = {
  client: 'ca-pub-7426857657290789',     // 기존 AdSense 게시자 ID (parkbeommin.github.io 승인됨)
  bannerSlot: '5615159769',               // 하단 배너 광고 단위 spin-defense-bottom (320x50)
  prodHosts: ['parkbeommin.github.io'],
  BANNER_H: 64, GAP: 160, GAP_MIN: 100,                 // 구글 권장: 게임 영역에서 150px 이상 떨어뜨리기
};
ADS.prod = ADS.prodHosts.includes(location.hostname);
ADS.enabled = !/[?&](rec|noads|embed)=1/.test(location.search); // embed=1: 다른 사이트 iframe 게재용 (광고 없음)
// 게임 포털 업로드용 빌드(itch.io, CrazyGames 등): 외부 광고·서비스워커·공유·앱 설치 끔
const PORTAL = window.SD_PORTAL === true || /[?&]portal=1/.test(location.search);
if (PORTAL) ADS.enabled = false;
// 안드로이드 앱(Capacitor) 빌드: window.SD_APP=true 를 동기화 스크립트가 넣는다. 웹 빌드에는 영향 없음
// 앱에서는 AdSense(배너·H5 광고)·서비스워커·PWA 설치를 끄고, 보상형 광고는 AdMob 플러그인으로
const APP = window.SD_APP === true;
if (APP) ADS.enabled = false;
// 앱은 공지·이벤트 코드를 실제 사이트에서 받아 최신으로 (실패하면 앱에 들어 있는 사본)
const LIVE = APP ? 'https://parkbeommin.github.io/spin-defense/' : '';
ADS.test = !ADS.prod || /[?&]adtest=1/.test(location.search);
ADS.preview = /[?&]adpreview=1/.test(location.search);   // 로컬에서 배너 자리 미리보기
ADS.wantBanner = ADS.enabled && (!!ADS.bannerSlot || ADS.preview);
ADS.ready = false; ADS.inAd = false; ADS.bannerOn = false; ADS.bannerFilled = false;
window.adsbygoogle = window.adsbygoogle || [];
function adBreak(o) { window.adsbygoogle.push(o); }
function adConfig(o) { window.adsbygoogle.push(o); }
// ===== Google Analytics 4 (실서비스 주소에서만, 광고 개인화·Google 신호 끔) =====
const GA = { id: 'G-RGKGFFP9N5', on: (ADS.prod || APP) && !/[?&](rec|noga)=1/.test(location.search) };
window.dataLayer = window.dataLayer || [];
function gtag() { window.dataLayer.push(arguments); }
if (GA.on) {
  const gs = document.createElement('script'); gs.async = true; gs.src = `https://www.googletagmanager.com/gtag/js?id=${GA.id}`; document.head.appendChild(gs);
  gtag('js', new Date()); gtag('config', GA.id, { allow_google_signals: false, allow_ad_personalization_signals: false });
  if (APP) gtag('set', 'user_properties', { app_platform: 'android' });
}
function track(name, params = {}) { if (GA.on) try { gtag('event', name, params); } catch (e) {} }
if (ADS.enabled) {
  const sc = document.createElement('script'); sc.async = true; sc.crossOrigin = 'anonymous';
  sc.src = `https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=${ADS.client}`;
  sc.setAttribute('data-ad-client', ADS.client);
  if (ADS.test) sc.setAttribute('data-adbreak-test', 'on');
  sc.setAttribute('data-ad-frequency-hint', '60s');
  document.head.appendChild(sc);
  adConfig({ preloadAdBreaks: 'on', sound: 'on', onReady: () => { ADS.ready = true; } });
}
function layoutBanner() {
  // 게임은 화면을 꽉 채우고, 배너는 맨 아래에 붙인다
  const bar = document.getElementById('adbar');
  ADS.bannerOn = ADS.wantBanner; bar.style.display = ADS.bannerOn ? 'flex' : 'none';
  if (ADS.bannerOn && !ADS.bannerFilled) {
    ADS.bannerFilled = true;
    if (ADS.bannerSlot) {
      const ins = document.createElement('ins'); ins.className = 'adsbygoogle';
      ins.style.cssText = 'display:inline-block;width:320px;height:50px';
      ins.setAttribute('data-ad-client', ADS.client); ins.setAttribute('data-ad-slot', ADS.bannerSlot);
      bar.appendChild(ins); try { window.adsbygoogle.push({}); } catch (e) {}
    } else { const ph = document.createElement('div'); ph.className = 'ph'; ph.textContent = '하단 배너 광고 자리 (320x50)'; bar.appendChild(ph); }
  }
  return ADS.bannerOn ? ADS.BANNER_H : 0;
}
// 화면 꽉 채우기: 캔버스는 (화면 - 배너) 전체. 게임 기본판(360x640)은 가로에 맞추고
// 남는 세로 공간(EX)은 필드와 아래 조작부 사이 풀밭으로, 남는 가로(OX)는 양옆 배경으로 채운다
let VW = W, VH = H, OX = 0, EX = 0, BASE_T = [1, 0, 0, 1, 0, 0];
// 세로로 긴 화면: 남는 세로(EX)를 필드 아래에 한꺼번에 몰지 않는다
// FY = 필드를 HUD 아래로 내리는 양(최대 40), INFO = 필드와 강화 줄 사이에 넣는 '다음 보스·버프' 정보 띠(공간이 충분할 때만)
let FY = 0, INFO = null;
const HUD_H = 80; // 이 높이 위는 HUD(일시정지·소리 버튼). 필드 이동과 무관
function layoutPlay() { FY = EX > 0 ? Math.round(Math.min(40, EX * 0.25)) : 0; const top = 388 + FY, gap = 384 + EX - top, h = 42; INFO = gap >= h + 20 ? { x: 12, y: Math.round(top + (gap - h) / 2), w: 336, h } : null; }
const SPLIT = 380; // 이 y보다 아래(강화 줄, 슬롯, 버튼)는 화면 맨 아래에 붙인다
// 안전 영역(앱 전체 화면의 상태바·제스처 바, 아이폰 노치): 그 안쪽에만 게임을 그린다
// 값은 고정하지 않고 기기에서 읽는다. 세 곳 중 가장 큰 값:
//  1) env(safe-area-inset-*): 브라우저·WebView 표준 (아이폰 노치, 최신 Android WebView)
//  2) --safe-area-inset-*: Capacitor SystemBars가 Android WindowInsets(상태바·제스처 바·카메라 홈)로 계산해 넣는 값
//  3) 앱에서만: StatusBar 플러그인 getInfo().height (Android WindowInsets.Type.statusBars 높이, dp)
const SAFE = { t: 0, b: 0 }, NATIVE_SAFE = { t: 0 };
const safeProbe = document.createElement('div');
safeProbe.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:0;visibility:hidden;pointer-events:none;box-sizing:content-box;padding-top:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));padding-bottom:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))';
document.body.appendChild(safeProbe);
function readSafe() { const cs = getComputedStyle(safeProbe); SAFE.t = Math.max(0, Math.round(parseFloat(cs.paddingTop) || 0), NATIVE_SAFE.t); SAFE.b = ADS.bannerOn ? 0 : Math.max(0, Math.round(parseFloat(cs.paddingBottom) || 0)); }
function resize() {
  const bannerH = layoutBanner(); readSafe();
  const cw = innerWidth, ch = Math.max(200, innerHeight - bannerH - SAFE.t - SAFE.b);
  cv.style.marginTop = SAFE.t + 'px';
  const s = Math.min(cw / W, ch / H);
  scale = s; VW = cw / s; VH = ch / s; OX = (VW - W) / 2; EX = VH - H;
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  BASE_T = [s * dpr, 0, 0, s * dpr, 0, 0];
  ctx.setTransform(...BASE_T);
  ctx.imageSmoothingQuality = 'high';
  layoutPlay();
}
addEventListener('resize', resize); resize();
// 앱이 상태바 높이를 늦게 알려 주거나 화면이 돌아가면 다시 맞춘다
// 앱: 네이티브 상태바 높이를 직접 물어본다 (상태바가 웹뷰 위에 겹쳐 있고 보일 때만). 화면 회전·복귀·상태바 변화 때 다시 확인
async function readNativeSafe() {
  if (!window.SD_APP) return;
  const SB = appPlugin('StatusBar'); if (!SB || !SB.getInfo) return;
  try { const i = await SB.getInfo(); const t = i && i.visible !== false && i.overlays !== false ? Math.max(0, Math.round(+i.height || 0)) : 0; if (t !== NATIVE_SAFE.t) { NATIVE_SAFE.t = t; resize(); } } catch (e) {}
}
if (window.SD_APP) {
  readNativeSafe(); setTimeout(readNativeSafe, 600); setTimeout(readNativeSafe, 2000);
  addEventListener('resize', () => setTimeout(readNativeSafe, 150));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(readNativeSafe, 150); });
  try { const SB = appPlugin('StatusBar'); if (SB && SB.addListener) { SB.addListener('statusBarVisibilityChanged', readNativeSafe); SB.addListener('statusBarOverlayChanged', readNativeSafe); } } catch (e) {}
}
// 값이 바뀌면 다시 맞춘다: Capacitor는 <html> style 에 --safe-area-inset-* 를 넣으므로 그 변화를 직접 감시하고,
// env() 변화(회전 등)는 탐침 요소의 테두리 크기 변화로 잡는다
const recheckSafe = () => { const t = SAFE.t, b = SAFE.b; readSafe(); if (t !== SAFE.t || b !== SAFE.b) resize(); };
if (window.MutationObserver) new MutationObserver(recheckSafe).observe(document.documentElement, { attributes: true, attributeFilter: ['style'] });
if (window.ResizeObserver) try { new ResizeObserver(recheckSafe).observe(safeProbe, { box: 'border-box' }); } catch (e) { new ResizeObserver(recheckSafe).observe(safeProbe); }
const FONT = 'Jua,MPR,"Hiragino Maru Gothic ProN","Apple SD Gothic Neo","Noto Sans KR",sans-serif';

// ===== 에셋 =====
const IMG = {}, ANIM = {};
const CHEER_T = 0.6, ROAR_T = 1.2;
// 시트의 한 프레임을 발 위치 기준으로 그린다. h = 캐릭터 키(논리 px)
const ANIM_WHITE = {};
function animWhite(type) {
  if (ANIM_WHITE[type]) return ANIM_WHITE[type];
  const im = ANIM[type].im, c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
  const x = c.getContext('2d'); x.drawImage(im, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  return (ANIM_WHITE[type] = c);
}
function drawAnim(type, anim, p, x, foot, h, flip = false, alpha = 1, sc = 1, white = 0, sx2 = 1, sy2 = 1) {
  const A = ANIM[type]; if (!A) return false;
  const list = A.anims[anim]; const fi = list[Math.max(0, Math.min(list.length - 1, Math.floor(p)))];
  const k = h / (A.charH * A.unit) * sc, sx = (fi % A.cols) * A.cw, sy = Math.floor(fi / A.cols) * A.ch;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, foot); ctx.scale((flip ? -1 : 1) * sx2, sy2);
  ctx.drawImage(A.im, sx, sy, A.cw, A.ch, -A.foot[0] * k, -A.foot[1] * k, A.cw * k, A.ch * k);
  if (white > 0) { ctx.globalAlpha *= Math.min(1, white); ctx.drawImage(animWhite(type), sx, sy, A.cw, A.ch, -A.foot[0] * k, -A.foot[1] * k, A.cw * k, A.ch * k); }

}
// 발 위치 기준점 (스프라이트 폭 대비). 공격 포즈는 이펙트 때문에 폭이 넓어서 따로 지정
const ANCH = { bomber: 0.52, chrono: 0.53, pioneer: 0.474, hunter: 0.46, breaker: 0.5, sword: 0.435, bow: 0.435, magic: 0.441, ice: 0.395, bard: 0.485, ninja: 0.536, storm: 0.463, dwarf: 0.532, alch: 0.419, sniper: 0.438, cat: 0.537, slimeking: 0.486, lich: 0.431, sword_atk: 0.34, bow_atk: 0.386, magic_atk: 0.367, ice_atk: 0.343 };
// 후반 보스 그림은 처음에 받지 않고, 해당 보스 8웨이브 전에 받는다 (첫 로딩을 가볍게)
const LATE_IMGS = ['dragon', 'demonlord', 'griffin', 'kraken', 'golem', 'medusa', 'chaos', 'sporequeen', 'ghostcaptain', 'clockknight', 'magmatitan', 'sphinx', 'mirrorwitch', 'hydra', 'frostempress', 'voidwhale', 'primordial'];

let ANIM_META = null, ANIM_LOAD = () => {}; const ANIM_REQ = new Set();

  if (LANG === 'ja' && document.fonts) ps.push(document.fonts.load('20px MPR', 'ヒーロー召喚').catch(() => {}));
