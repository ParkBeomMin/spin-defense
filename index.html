'use strict';

const TIPS = ['같은 등급, 같은 직업 영웅 2명을 끌어서 겹치면 합체!', '별 3개가 나오면 0.1% 확률의 전설 영웅', '기사는 사거리가 짧아요. 길가 칸에 두세요', '얼음공주는 몬스터를 느리게 만들어요', '골드가 남으면 아래 강화 버튼으로 직업을 강화', '10웨이브마다 보스가 나와요. 미리 강하게!', '몬스터가 60마리 쌓이면 패배해요', '필요 없는 영웅은 왼쪽 아래로 끌어서 판매'];

}
function layoutBanner() {

// 화면 꽉 채우기: 캔버스는 (화면 - 배너) 전체. 게임 기본판(360x640)은 가로에 맞추고
// 남는 세로 공간(EX)은 필드와 아래 조작부 사이 풀밭으로, 남는 가로(OX)는 양옆 배경으로 채운다
let VW = W, VH = H, OX = 0, EX = 0, BASE_T = [1, 0, 0, 1, 0, 0];
const SPLIT = 380; // 이 y보다 아래(강화 줄, 슬롯, 버튼)는 화면 맨 아래에 붙인다
function resize() {
  const bannerH = layoutBanner();
  const cw = innerWidth, ch = Math.max(200, innerHeight - bannerH);
  const s = Math.min(cw / W, ch / H);
  scale = s; VW = cw / s; VH = ch / s; OX = (VW - W) / 2; EX = VH - H;
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  BASE_T = [s * dpr, 0, 0, s * dpr, 0, 0];
  ctx.setTransform(...BASE_T);
  ctx.imageSmoothingQuality = 'high';
}
addEventListener('resize', resize); resize();
const FONT = 'Jua,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';

// ===== 에셋 =====
const IMG = {}, ANIM = {};
const CHEER_T = 0.6, ROAR_T = 1.2;
// 시트의 한 프레임을 발 위치 기준으로 그린다. h = 캐릭터 키(논리 px)
const ANIM_WHITE = {};
function animWhite(type) {
  if (ANIM_WHITE[type]) return ANIM_WHITE[type];
  const im = ANIM[type].im, c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
  const x = c.getContext('2d'); x.drawImage(im, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  return (ANIM_WHITE[type] = c);
}
function drawAnim(type, anim, p, x, foot, h, flip = false, alpha = 1, sc = 1, white = 0, sx2 = 1, sy2 = 1) {
  const A = ANIM[type]; if (!A) return false;
  const list = A.anims[anim]; const fi = list[Math.max(0, Math.min(list.length - 1, Math.floor(p)))];
  const k = h / (A.charH * A.unit) * sc, sx = (fi % A.cols) * A.cw, sy = Math.floor(fi / A.cols) * A.ch;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, foot); ctx.scale((flip ? -1 : 1) * sx2, sy2);
  ctx.drawImage(A.im, sx, sy, A.cw, A.ch, -A.foot[0] * k, -A.foot[1] * k, A.cw * k, A.ch * k);
  if (white > 0) { ctx.globalAlpha *= Math.min(1, white); ctx.drawImage(animWhite(type), sx, sy, A.cw, A.ch, -A.foot[0] * k, -A.foot[1] * k, A.cw * k, A.ch * k); }
  ctx.restore(); return true;
}
// 발 위치 기준점 (스프라이트 폭 대비). 공격 포즈는 이펙트 때문에 폭이 넓어서 따로 지정
const ANCH = { sword: 0.435, bow: 0.435, magic: 0.441, ice: 0.395, sword_atk: 0.34, bow_atk: 0.386, magic_atk: 0.367, ice_atk: 0.343 };
const IMG_NAMES = ['sword', 'bow', 'magic', 'ice', 'sword_atk', 'bow_atk', 'magic_atk', 'ice_atk', 'slime', 'slime_hurt', 'goblin', 'skeleton', 'boss', 'coin', 'star', 'heart', 'gem', 'bolt', 'chest'];
function loadAssets() {
  const ps = IMG_NAMES.map(n => new Promise(res => { const im = new Image(); im.onload = () => res(); im.onerror = () => res(); im.src = `assets/${n}.png`; IMG[n] = im; }));
  ps.push(new Promise(res => { const im = new Image(); im.onload = res; im.onerror = res; im.src = 'assets/bg.jpg'; IMG.bg = im; }));
  // 뼈대 애니메이션 스프라이트 시트 (tools/rig.js로 구움)
  ps.push(fetch('assets/anim.json').then(r => r.json()).then(meta => Promise.all(Object.keys(meta).map(k => new Promise(res => {
    const im = new Image(); im.onload = () => { ANIM[k] = { im, ...meta[k] }; res(); }; im.onerror = res; im.src = `assets/anim_${k}.webp`;
  })))).catch(() => {}));
  ps.push(document.fonts ? document.fonts.load('20px Jua').catch(() => {}) : Promise.resolve());
  return Promise.all(ps);
}

// ===== 데이터 =====
const TYPES = {
  sword: { name: '기사',     range: 78,  dmg: 34, rate: 0.75, color: '#ffcf5a' },
  bow:   { name: '여우궁수', range: 125, dmg: 13, rate: 0.33, color: '#9be36d' },
  magic: { name: '대마법사', range: 100, dmg: 15, rate: 1.0, splash: 44, color: '#c792ff' },
  ice:   { name: '얼음공주', range: 105, dmg: 7,  rate: 0.7, slow: 0.45, color: '#8fd8ff' },
};
const TYPE_KEYS = Object.keys(TYPES);
const GRADES = [null,
  { name: '일반', col: '#c9ced6', m: 1 },
  { name: '희귀', col: '#4fa3ff', m: 2.7 },
  { name: '영웅', col: '#c070ff', m: 7 },
  { name: '전설', col: '#ffb020', m: 18 },
];
const SELL = [0, 10, 30, 90, 270];
const SYMS = ['sword', 'bow', 'magic', 'ice', 'star'];
const SYM_W = [23, 23, 22, 22, 10];
const ENEMY = {
  slime:    { hp: 1.0, spd: 46, h: 22 },
  goblin:   { hp: 0.8, spd: 62, h: 30 },
  skeleton: { hp: 1.6, spd: 38, h: 32 },
};

// ===== 레이아웃 =====
const COLS = 5, ROWS = 4, CELL = 52, GX = 50, GY = 132;
const PL = 25, PR = 335, PT = 90, PB = 372, PW = PR - PL, PH = PB - PT, PER = 2 * (PW + PH);
const GOLD_POS = [300, 30];
function pathPos(d) {
  d = ((d % PER) + PER) % PER;
  if (d < PW) return [PL + d, PT, 1, 1]; d -= PW;
  if (d < PH) return [PR, PT + d, 1, 0]; d -= PH;
  if (d < PW) return [PR - d, PB, -1, 1]; d -= PW;
  return [PL, PB - d, -1, 0];
}
const cellCenter = i => [GX + (i % COLS) * CELL + CELL / 2, GY + Math.floor(i / COLS) * CELL + CELL / 2];
function cellAt(x, y) {
  const c = Math.floor((x - GX) / CELL), r = Math.floor((y - GY) / CELL);
  return (c < 0 || c >= COLS || r < 0 || r >= ROWS) ? -1 : r * COLS + c;
}
const BTN = {
  spin:  { x: 110, y: 556, w: 140, h: 64 },
  ad:    { x: 260, y: 562, w: 90, h: 54 },
  speed: { x: 10,  y: 562, w: 90, h: 54 },

const REEL = { x: 72, y: 448, w: 64, h: 72, gap: 12 };
const inRect = (x, y, b) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ===== 저장값 =====
const store = {
  get best() { return +(localStorage.getItem('sd_best') || 0); }, set best(v) { localStorage.setItem('sd_best', v); },
  get tut() { return +(localStorage.getItem('sd_tut') || 0); }, set tut(v) { localStorage.setItem('sd_tut', v); },
  get mute() { return localStorage.getItem('sd_mute') === '1'; }, set mute(v) { localStorage.setItem('sd_mute', v ? '1' : '0'); },

// ===== 사운드 (WebAudio 합성, 외부 파일 없음) =====
let AC = null, lastCoinSfx = 0;
// synth(ac, dest, base, k): 실제 재생과 영상 녹화(오프라인 렌더)에서 같이 씁니다
let SY = null; // { ac, dest, base }
function tone(f, dur, type = 'sine', vol = 0.15, f2 = null, delay = 0) {
  const ac = SY.ac, t0 = SY.base + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);

  o.connect(g).connect(SY.dest); o.start(t0); o.stop(t0 + dur + 0.02);
}
const SFX_GAP = { coin: 70, hit: 55, slash: 70, crit: 90, boom: 90, shatter: 80, poof: 70, thud: 150 };
const sfxLast = {};
const NOISE = new WeakMap();
function noise(dur, vol, ftype = 'bandpass', f = 1500, delay = 0, f2 = null, q = 1) {
  const ac = SY.ac, t0 = SY.base + delay;
  let buf = NOISE.get(ac);
  if (!buf) { buf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.6), ac.sampleRate); const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; NOISE.set(ac, buf); }
  const src = ac.createBufferSource(); src.buffer = buf;
  const fl = ac.createBiquadFilter(); fl.type = ftype; fl.frequency.setValueAtTime(f, t0); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t0 + dur); fl.Q.value = q;
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

}

      case 'jackpot': [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.22, 'square', 0.07, null, i * 0.08)); tone(1568, 0.6, 'triangle', 0.1, null, 0.42); break;
      case 'merge': tone(330, 0.25, 'sine', 0.16, 990); tone(660, 0.18, 'triangle', 0.08, 1320, 0.08); break;

      case 'coin': tone(1320, 0.06, 'square', 0.035, 1760); break;

    }
}

// ===== 상태 =====

  S.wave++; S.waveT = WAVE_LEN;

function drawBanner() {

  ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, 236); ctx.scale(s, s);

function drawTutorial() {

  else if (tut === 1) {

  } else if (tut === 2) {

function drawTitle() {

  for (let i = 0; i < 3; i++) icon('star', W / 2 - 112 + i * 15, 584, 16);

  else text(`최고 기록 WAVE ${store.best}`, W / 2, 354, 13, 'rgba(255,255,255,.6)', 'center', 3);
  if (!S.revived) button(BTN.revive, '#2f8ae0', true, (cx, cy) => { icon('heart', cx - 70, cy, 26); if (adMode()) { text('광고 보고 부활', cx + 10, cy, 19, '#fff', 'center', 4); rr(cx + 72, cy - 22, 24, 14, 4); ctx.fillStyle = '#ffcf5a'; ctx.fill(); text('AD', cx + 84, cy - 15, 9, '#5a3a00'); } else text(`${REVIVE_WAIT}초 쉬고 부활`, cx + 10, cy, 19, '#fff', 'center', 4); }, 'revive');
  button(BTN.retry, '#ff4f72', true, (cx, cy) => text('다시 하기', cx, cy, 20, '#fff', 'center', 4, '#8a1f38'), 'retry');
}
function drawPause() {
  ctx.fillStyle = 'rgba(10,6,24,.7)'; ctx.fillRect(-OX - 5, -EX - 5, VW + 10, VH + EX + 10);
  text('일시정지', W / 2, 250, 32, '#fff', 'center', 6);
  button(BTN.resume, '#ff4f72', true, (cx, cy) => text('계속하기', cx, cy, 22, '#fff', 'center', 4, '#8a1f38'), 'resume');
}
function drawAd() {
  if (ad.kind === 'wait') {
    ctx.fillStyle = 'rgba(10,6,24,.96)'; ctx.fillRect(-OX - 5, -EX - 5, VW + 10, VH + EX + 10);
    const p = 1 - ad.t / ad.max, pulse = 1 + Math.sin(T * 6) * 0.06;
    ctx.save(); ctx.translate(W / 2, 250); ctx.scale(pulse, pulse); icon('heart', 0, 0, 72); ctx.restore();
    text('영웅들이 숨을 고르는 중...', W / 2, 315, 18, '#fff', 'center', 3);
    text(String(Math.ceil(ad.t)), W / 2, 365, 40, '#ff8fa3', 'center', 6);
    rr(W / 2 - 90, 400, 180, 8, 4); ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fill(); rr(W / 2 - 90, 400, 180 * p, 8, 4); ctx.fillStyle = '#ff8fa3'; ctx.fill();
    return;
  }

  icon('chest', W / 2, 250, 70);

  text(`${Math.ceil(ad.t)}초 후 보상 지급`, W / 2, 340, 14, 'rgba(255,255,255,.7)');
  text('실제 서비스에서는 구글 광고가 나와요', W / 2, 380, 11, 'rgba(255,255,255,.4)');

function draw() {

  if (screen === 'title') { drawBG(); ctx.save(); ctx.translate(OX, EX / 2); drawTitle(); ctx.restore(); return; }
  ctx.save();
  if (S.shake > 0) { const m = Math.min(1, S.shake / 0.4); ctx.translate((Math.random() - 0.5) * 10 * m, (Math.random() - 0.5) * 10 * m); }
  if (S.kick) { const q = S.kick.t / 0.12; ctx.translate(S.kick.x * q, S.kick.y * q); }
  drawBG();
  ctx.save(); ctx.translate(OX, 0); drawField(); ctx.restore();
  ctx.save(); ctx.translate(OX, EX); drawUpgrades(); drawSlot(); ctx.restore();
  ctx.save(); ctx.translate(OX, 0); drawHUD(); ctx.restore();
  if (S.flash) { ctx.save(); ctx.globalAlpha = Math.min(1, S.flash.a); ctx.fillStyle = S.flash.col; ctx.fillRect(-20, -20, VW + 40, VH + 40); ctx.restore(); }
  ctx.save(); ctx.translate(OX, 0); drawBanner(); ctx.restore();
  ctx.save(); ctx.translate(OX, store.tut === 1 ? 0 : EX); drawTutorial(); ctx.restore();
  if (drag && drag.moved) { ctx.save(); ctx.translate(OX, 0); drawUnitAt(S.units[drag.idx], drag.rx, drag.ry - 10, { alpha: 0.95, still: true }); ctx.restore(); }
  ctx.restore();

  ctx.restore();
  // 녹화용 터치 표시 (?rec=1)
  if (REC && touch.show > 0) {

    ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(touch.x + OX, touch.y, touch.down ? 13 : 16, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();

const REC = /[?&]rec=1/.test(location.search);
const touch = { x: 0, y: 0, down: false, show: 0 };
if (REC) {
  const tp = e => { const [x, y] = rawPos(e); touch.x = x; touch.y = y; };
  cv.addEventListener('pointerdown', e => { tp(e); touch.down = true; touch.show = 1; }, true);
  cv.addEventListener('pointermove', e => { tp(e); if (touch.down) touch.show = 1; }, true);
  cv.addEventListener('pointerup', e => { tp(e); touch.down = false; touch.show = 0.35; }, true);
}

// ===== 입력 =====
// 화면 좌표 -> 게임 기본판 좌표. 위쪽(필드)은 그대로, 아래 조작부는 EX만큼 올려서 계산
function rawPos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / scale - OX, (e.clientY - r.top) / scale]; }
function pos(e) {
  const [x, y] = rawPos(e);
  if (screen !== 'play' || paused || ad) return [x, y - EX / 2];
  return [x, y < SPLIT ? y : Math.max(SPLIT, y - EX)];
}
function hitKey(x, y) {
  if (screen === 'title') return inRect(x, y, BTN.start) ? 'start' : null;
  if (screen === 'over') { if (!S.revived && inRect(x, y, BTN.revive)) return 'revive'; if (inRect(x, y, BTN.retry)) return 'retry'; return null; }
  if (paused) return inRect(x, y, BTN.resume) ? 'resume' : null;

}
function activate(key) {
  switch (key) {
    case 'start': newGame(); screen = 'play'; sfx('click'); break;
    case 'retry': sfx('click'); betweenGames(() => { newGame(); screen = 'play'; }); break;
    case 'revive': if (adMode()) showRewardAd(revive, 'revive'); else ad = { t: REVIVE_WAIT, max: REVIVE_WAIT, onReward: revive, kind: 'wait' }; break;
    case 'resume': paused = false; sfx('click'); break;
    case 'spin': doSpin(false); break;
    case 'speed': S.speed = S.speed === 1 ? 2 : 1; sfx('click'); break;
    case 'sound': store.mute = !store.mute; sfx('click'); break;
    case 'ad':
      if (!canSpin()) { flash('칸이 꽉 찼거나 슬롯이 도는 중이에요', '#ffb35c'); sfx('error'); }

cv.addEventListener('pointerdown', e => {
  e.preventDefault(); if (ad || screen === 'loading') return;
  const [x, y] = pos(e);
  if (screen === 'play' && !paused) {
    const i = cellAt(x, y);
    if (i >= 0 && S.units[i]) { const [rx0, ry0] = rawPos(e); drag = { idx: i, x, y, sx: x, sy: y, rx: rx0, ry: ry0, moved: false }; try { cv.setPointerCapture(e.pointerId); } catch (_) {} return; }
  }
  const k = hitKey(x, y);
  if (k) { press = { key: k }; try { cv.setPointerCapture(e.pointerId); } catch (_) {} }

});
cv.addEventListener('pointermove', e => {
  const [x, y] = pos(e);
  if (drag) { const [rx1, ry1] = rawPos(e); drag.rx = rx1; drag.ry = ry1; drag.x = x; drag.y = y; if (!drag.moved && Math.hypot(x - drag.sx, y - drag.sy) > 8) { drag.moved = true; selected = -1; } }
  else if (press && hitKey(x, y) !== press.key) press = null;

  const [x, y] = pos(e);
  if (press) { const k = press.key; press = null; if (hitKey(x, y) === k) activate(k); return; }
  if (!drag) return;
  const d = drag; drag = null;
  if (!S.units[d.idx]) return;
  if (!d.moved) {
    selected = selected === d.idx ? -1 : d.idx;
    if (selected >= 0) { const su = S.units[selected], st = stats(su); flash(`${GRADES[su.grade].name} ${TYPES[su.type].name} · 공격력 ${Math.round(st.dmg)} · 판매 ${SELL[su.grade]}G`, GRADES[su.grade].col, 2.5); sfx('click'); }
    return;
  }
  const u = S.units[d.idx];
  if (inRect(d.x, d.y, BTN.speed)) {
    S.gold += SELL[u.grade]; S.units[d.idx] = null; selected = -1;
    flash(`판매 +${SELL[u.grade]} 골드`, '#ffd166', 1.2); sfx('sell'); return;
  }

    if (ng >= 3) { banner(`${GRADES[ng].name}!`, `${TYPES[nt].name} 등장`, GRADES[ng].col, 1.6); S.shake = 0.2; }
    else flash(`합체! ${GRADES[ng].name} ${TYPES[nt].name}`, GRADES[ng].col, 1.8);

cv.addEventListener('pointercancel', () => { drag = null; press = null; });

// ===== 루프 =====
let last = performance.now();
function stepFrame(dt, render = true) {
  T += dt;

loadAssets().then(() => { screen = 'title'; });
